name: Build Android

# 触发：推送 v* 标签，或手动 dispatch
# 说明：安卓端主动攻击走 OneShot + Termux + root，依赖均由 Termux 提供
#       （`pkg install pixiewps wpa-supplicant iw ...`），无需本仓库编译 C 二进制。
#       本 workflow 打包「Termux 工具包」：纯 Python 离线引擎 + 一键安装脚本 + 文档。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-termux-toolkit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Termux toolkit
        run: |
          mkdir -p dist
          zip -r dist/WCracking-termux.zip \
            core android README.md LICENSE requirements.txt tests \
            -x "*/__pycache__/*" "*.pyc"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WCracking-termux
          path: dist/WCracking-termux.zip

  release:
    needs: [build-termux-toolkit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            artifacts/WCracking-termux/WCracking-termux.zip
