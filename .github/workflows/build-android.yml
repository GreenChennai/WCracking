name: Build Android

# 触发：推送 v* 标签，或手动 dispatch
# 说明：pixiewps 仅依赖 libc + pthread，可用 NDK clang 直接交叉编译出安卓二进制。
#       bionic 提供 getopt_long（API 12+），故可正常编译。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-pixiewps-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    env:
      NDK_VER: r26d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone pixiewps
        run: git clone --depth 1 https://github.com/wiire-a/pixiewps.git /tmp/pixiewps

      - name: Download Android NDK
        run: |
          curl -sSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp
          echo "NDK_HOME=/tmp/android-ndk-${NDK_VER}" >> "$GITHUB_ENV"

      - name: Map ABI to NDK clang triplet
        id: triplet
        shell: bash
        run: |
          case "${{ matrix.abi }}" in
            arm64-v8a)   echo "triplet=aarch64-linux-android21" >> "$GITHUB_OUTPUT" ;;
            armeabi-v7a) echo "triplet=armv7a-linux-androideabi21" >> "$GITHUB_OUTPUT" ;;
            x86_64)      echo "triplet=x86_64-linux-android21" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build pixiewps for ${{ matrix.abi }}
        run: |
          cd /tmp/pixiewps
          CC="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ steps.triplet.outputs.triplet }}-clang"
          make clean
          make CC="$CC"
          mkdir -p /tmp/out
          cp pixiewps "/tmp/out/pixiewps-${{ matrix.abi }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixiewps-${{ matrix.abi }}
          path: /tmp/out/pixiewps-${{ matrix.abi }}

  release:
    needs: [build-pixiewps-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: artifacts/**/*
