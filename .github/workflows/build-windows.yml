name: Build Windows

# 触发：推送 v* 标签，或手动 dispatch
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # 离线引擎为纯 Python（core/pixie_dust.py），打包为单个 exe，含 PyQt6 GUI
      - name: Build GUI exe (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name WCracking --paths . desktop/app.py
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WCracking-windows
          path: dist/WCracking.exe

  release:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            artifacts/WCracking-windows/WCracking.exe
