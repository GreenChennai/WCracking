plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.wcracking.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.wcracking.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    // release 签名：优先读环境变量，否则用仓库内 release.keystore（CI 用 keytool 生成）
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "wcracking"
            keyAlias System.getenv("KEY_ALIAS") ?: "wcracking"
            keyPassword System.getenv("KEY_PASSWORD") ?: "wcracking"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // libsu：root shell 能力（无需 Termux），v6.0.0 已迁至 JitPack 新坐标
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'
}
